[workspace]
members = [
  "crates/arena-protocol",
  "crates/othello-engine",
  "workers/arena",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
